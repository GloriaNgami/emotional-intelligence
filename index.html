<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Self-Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen py-10 px-4">
    <div class="max-w-3xl mx-auto bg-white shadow-lg rounded-xl p-8">
        
        <!-- Header -->
        <div id="header-section" class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Team Self-Assessment</h1>
            <p class="text-sm text-gray-600 mt-2">Please read each statement carefully and rate how often it applies to you. There are no right or wrong answers.</p>
        </div>

        <!-- Form / Assessment View -->
        <form id="assessment-form" onsubmit="handleSubmit(event)">
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Your Full Name:</label>
                <input type="text" id="fullname" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div id="questions-container" class="space-y-6">
                <!-- Questions will be injected dynamically via JavaScript -->
            </div>

            <!-- Reflections -->
            <div class="mt-8 space-y-6 border-t pt-6">
                <h3 class="text-lg font-semibold text-gray-900">Reflection</h3>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">For your strongest area, give an example of how you demonstrate your strength in daily life or work:</label>
                    <textarea id="reflection-strong" rows="3" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">For your weakest area, give an example of how this affects you AND others in daily life or work:</label>
                    <textarea id="reflection-weak" rows="3" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">What steps can you take to strengthen yourself in your weakest area, and how will this benefit you?</label>
                    <textarea id="reflection-action" rows="3" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>
            </div>

            <button type="submit" class="mt-8 w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition">
                Submit Assessment & View Report
            </button>
        </form>

        <!-- Report View (Hidden Initially) -->
        <div id="report-section" class="hidden space-y-6">
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-6 text-center">
                <h2 class="text-2xl font-bold text-blue-900">Assessment Complete!</h2>
                <p class="text-blue-700 mt-1" id="report-name-display"></p>
            </div>

            <div class="bg-white border rounded-lg p-6 shadow-sm">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">Your Individual Score Breakdown</h3>
                <div id="scores-breakdown" class="space-y-3">
                    <!-- Dynamic Score Bars -->
                </div>
            </div>

            <div class="bg-gray-100 rounded-lg p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-2">General Team Summary Overview</h3>
                <p class="text-sm text-gray-600 mb-4">Total submissions recorded: <span id="team-count" class="font-bold">0</span></p>
                <div id="team-averages" class="space-y-2 text-sm">
                    <!-- Team general averages -->
                </div>
            </div>

            <button onclick="location.reload()" class="w-full bg-gray-600 text-white font-semibold py-2 rounded-lg hover:bg-gray-700 transition">
                Take Another Assessment / Reset
            </button>
        </div>

    </div>

    <script>
        // 40 Statements (Domain names intentionally excluded to prevent bias)
        const statements = [
            // Domain 1 (Items 1-10)
            "My feelings are clear to me at any given moment",
            "Emotions play an important part in my life",
            "My moods impact the people around me",
            "I find it easy to put words to my feelings",
            "My moods are easily affected by external events",
            "I can easily sense when I'm going to be angry",
            "I readily tell others my true feelings",
            "I find it easy to describe my feelings",
            "Even when I'm upset, I'm aware of what's happening to me",
            "I am able to stand apart from my thoughts and feelings and examine them",
            // Domain 2 (Items 11-20)
            "I accept responsibility for my reactions",
            "I find it easy to make goals and stick with them",
            "I am an emotionally balanced person",
            "I am a very patient person",
            "I can accept critical comments from others without becoming angry",
            "I maintain my composure, even during stressful times",
            "If an issue does not affect me directly, I don't let it bother me",
            "I can restrain myself when I feel anger towards someone",
            "I control urges to overindulge in things that could damage my well being",
            "I direct my energy into creative work or hobbies",
            // Domain 3 (Items 21-30)
            "I consider the impact of my decisions on other people",
            "I can tell easily tell if the people around me are becoming annoyed",
            "I sense it when a person's mood changes",
            "I am able to be supportive when giving bad news to others",
            "I am generally able to understand the way other people feel",
            "My friends can tell me intimate things about themselves",
            "It genuinely bothers me to see other people suffer",
            "I usually know when to speak and when to be silent",
            "I care what happens to other people",
            "I understand when people's plans change",
            // Domain 4 (Items 31-40)
            "I am able to show affection",
            "My relationships are safe places for me",
            "I find it easy to share my deep feelings with others",
            "I am good at motivating others",
            "I am a fairly cheerful person",
            "It is easy for me to make friends",
            "People tell me I am sociable and fun",
            "I like helping people",
            "Others can depend on me",
            "I am able to talk someone down if they are very upset"
        ];

        const container = document.getElementById('questions-container');

        // Render questions dynamically
        statements.forEach((stmt, index) => {
            const div = document.createElement('div');
            div.className = "p-4 bg-gray-50 rounded-lg border border-gray-100";
            div.innerHTML = `
                <p class="text-sm font-medium text-gray-800 mb-2">${index + 1}. ${stmt}</p>
                <div class="grid grid-cols-5 gap-2 text-center text-xs text-gray-600">
                    <label class="cursor-pointer p-2 bg-white rounded border hover:bg-blue-50"><input type="radio" name="q${index}" value="0" required class="block mx-auto mb-1">0 - Never</label>
                    <label class="cursor-pointer p-2 bg-white rounded border hover:bg-blue-50"><input type="radio" name="q${index}" value="1" class="block mx-auto mb-1">1 - Rarely</label>
                    <label class="cursor-pointer p-2 bg-white rounded border hover:bg-blue-50"><input type="radio" name="q${index}" value="2" class="block mx-auto mb-1">2 - Sometimes</label>
                    <label class="cursor-pointer p-2 bg-white rounded border hover:bg-blue-50"><input type="radio" name="q${index}" value="3" class="block mx-auto mb-1">3 - Often</label>
                    <label class="cursor-pointer p-2 bg-white rounded border hover:bg-blue-50"><input type="radio" name="q${index}" value="4" class="block mx-auto mb-1">4 - Always</label>
                </div>
            `;
            container.appendChild(div);
        });

        function handleSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('fullname').value;
            
            let s1 = 0, s2 = 0, s3 = 0, s4 = 0;

            for (let i = 0; i < 40; i++) {
                const val = parseInt(document.querySelector(`input[name="q${i}"]:checked`).value);
                if (i < 10) s1 += val;
                else if (i < 20) s2 += val;
                else if (i < 30) s3 += val;
                else s4 += val;
            }

            // Save submission to localStorage for basic general reporting across team members on the same device/browser
            let submissions = JSON.parse(localStorage.getItem('team_eq_submissions') || '[]');
            submissions.push({ name, s1, s2, s3, s4, total: s1 + s2 + s3 + s4 });
            localStorage.setItem('team_eq_submissions', JSON.stringify(submissions));

            // Display Individual Report
            document.getElementById('assessment-form').classList.add('hidden');
            document.getElementById('header-section').classList.add('hidden');
            document.getElementById('report-section').classList.remove('hidden');
            document.getElementById('report-name-display').innerText = `Report for: ${name}`;

            const breakdown = document.getElementById('scores-breakdown');
            breakdown.innerHTML = `
                <div class="flex justify-between items-center border-b py-2"><span class="font-medium">Area A Score:</span> <span class="font-bold text-blue-600">${s1} / 40</span></div>
                <div class="flex justify-between items-center border-b py-2"><span class="font-medium">Area B Score:</span> <span class="font-bold text-blue-600">${s2} / 40</span></div>
                <div class="flex justify-between items-center border-b py-2"><span class="font-medium">Area C Score:</span> <span class="font-bold text-blue-600">${s3} / 40</span></div>
                <div class="flex justify-between items-center py-2"><span class="font-medium">Area D Score:</span> <span class="font-bold text-blue-600">${s4} / 40</span></div>
                <div class="mt-4 p-3 bg-gray-50 rounded flex justify-between items-center"><span class="font-bold">Total EQ Score:</span> <span class="font-extrabold text-lg text-gray-900">${s1 + s2 + s3 + s4} / 160</span></div>
            `;

            // Display General Team Summary
            document.getElementById('team-count').innerText = submissions.length;
            const avg1 = (submissions.reduce((acc, curr) => acc + curr.s1, 0) / submissions.length).toFixed(1);
            const avg2 = (submissions.reduce((acc, curr) => acc + curr.s2, 0) / submissions.length).toFixed(1);
            const avg3 = (submissions.reduce((acc, curr) => acc + curr.s3, 0) / submissions.length).toFixed(1);
            const avg4 = (submissions.reduce((acc, curr) => acc + curr.s4, 0) / submissions.length).toFixed(1);

            document.getElementById('team-averages').innerHTML = `
                <p>Team Average - Emotional awareness: <strong>${avg1} / 40</strong></p>
                <p>Team Average - Emotional management: <strong>${avg2} / 40</strong></p>
                <p>Team Average - Social emotional awareness: <strong>${avg3} / 40</strong></p>
                <p>Team Average - Relational management: <strong>${avg4} / 40</strong></p>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
